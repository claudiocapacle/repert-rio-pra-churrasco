<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: coluna única centrada (celular primeiro). Barra de ferramentas fixa embaixo, ao alcance do polegar; cada ferramenta abre uma gaveta. */
:root{
  --bg:#f5efe3; --paper:#fbf8f1; --ink:#1f2430; --muted:#7a7366; --line:#e4d9c6;
  --blue:#1d4f91; --blue-soft:#e3ebf6; --orange:#e2640f; --orange-soft:#fbe4d1; --tab:#5a6f8c;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --tb:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top.lined{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.05;letter-spacing:-.01em}
.top h1 span{color:var(--orange)}
.top h1.brand{font-family:var(--f-body);font-weight:900;font-size:23px;letter-spacing:-.045em;display:flex;align-items:center;gap:8px;line-height:1}.top h1.brand .b1{color:var(--ink)}.top h1.brand svg{flex:none}
.top .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--paper)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan{margin-left:auto;white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.plan.pro{background:var(--orange);border-color:var(--orange);color:#fff}

/* início */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:8px}
.tabs button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.rows{display:flex;flex-direction:column;padding-bottom:40px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .open{border:0;background:none;text-align:left;padding:0;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--blue);min-width:2.6em;text-align:right}
.add{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--orange)}
.add svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.add.in{background:var(--orange);border-color:var(--orange);color:#fff}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:18px 2px 6px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px;text-align:left;width:100%}
.card b{font-size:16px}
.card small{color:var(--muted);grid-column:1}
.card .go{grid-row:1/3;grid-column:2;color:var(--muted);font-size:20px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);background:var(--orange-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);margin-top:12px}
.primary{border:0;background:var(--orange);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;min-height:46px}
.ghost{border:1px solid var(--line);background:var(--paper);font-weight:600;border-radius:12px;padding:10px 14px;min-height:42px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--orange)}

/* repertório */
.rephead{padding:8px 0 4px}
.rephead input{font-family:var(--f-display);font-weight:800;font-size:22px;border:0;background:none;padding:4px 0;width:100%;border-bottom:1.5px dashed transparent}
.rephead input:focus{border-bottom-color:var(--line);outline:none}
.rephead p{margin:2px 0 12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.ritem{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.ritem .n{font-family:var(--f-mono);font-weight:700;color:var(--orange);text-align:center}
.mini{display:flex;gap:2px}
.mini button{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center}
.mini button:hover{background:var(--paper);color:var(--ink)}
.mini svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* música */
.shead{padding:14px 0 6px}
.shead h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,6vw,32px);line-height:1.1;text-wrap:balance}
.shead .by{color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:600}
.chip .v{font-family:var(--f-mono);font-weight:700;color:var(--blue)}
.chip.key{border-color:var(--blue)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
.strip{display:flex;gap:6px;overflow-x:auto;padding:14px 0 8px;margin-top:14px;border-top:1px solid var(--line);scrollbar-width:thin}
.strip button{flex:none;min-width:max-content;border:0;background:none;padding:2px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:0}
.strip button:hover{background:var(--paper)}
.strip .nm{font-family:var(--f-mono);font-weight:700;font-size:12px;color:var(--blue);white-space:nowrap}
.sheetwrap{overflow-x:auto;margin-top:14px;padding-bottom:calc(var(--tb) + 90px)}
.sheet{font-family:var(--f-mono);font-weight:500;font-size:var(--fs,15px);line-height:1.34;margin:0;white-space:pre;color:var(--ink)}
.sheet .r{display:block;min-height:1.34em}
.sheet .cr{font-weight:700}
.sheet .refrao{font-weight:700}
.sheet .gap{display:block;height:.9em}
.c{color:var(--blue);cursor:pointer;border-radius:3px}
.c:hover{background:var(--blue-soft)}
.b{color:#b8ab95;font-weight:500}
.p,.rp{color:var(--orange)}
.t{color:var(--tab);font-weight:700}

/* barra inferior */
.tools{position:fixed;z-index:25;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tools .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tb)}
.tools button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tools button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tools button .v{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--blue);line-height:22px}
.tools button.on{color:var(--orange)}
.tools button.on svg{stroke:var(--orange)}
.repnav{position:fixed;z-index:24;left:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.repnav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:46px}
.repnav button{border:0;background:none;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0;color:var(--ink)}
.repnav button:disabled{color:var(--line);cursor:default}
.repnav .nx{text-align:right}
.repnav span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* gaveta */
.scrim{position:fixed;inset:0;z-index:39;background:rgba(31,36,48,.28)}
.drawer{position:fixed;z-index:40;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(31,36,48,.18);max-height:82vh;overflow:auto;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.drawer .wrap{max-width:560px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 6px}
.drawer h3{margin:6px 0 4px;font-size:18px}
.drawer p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 0 8px;font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:1px}
.keys button small{font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-height:14px}
.keys button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.keys button.on small{color:#fff}
.step{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;text-align:left;margin-bottom:8px}
.opt b{font-size:16px}.opt small{color:var(--muted)}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.big{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 14px}
.big .num{font-family:var(--f-mono);font-weight:700;font-size:44px;min-width:3ch;text-align:center}
.round{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--orange)}
.beats{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.beats i.hit{background:var(--orange)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:12px}
.switch input{width:22px;height:22px;accent-color:var(--orange)}
.diag{display:flex;gap:18px;align-items:center;justify-content:center}
.diag .nm{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--blue)}
.replist .opt{flex-direction:row;align-items:center;justify-content:space-between}
.newrep{display:flex;gap:8px;margin-top:6px}
.newrep input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--tb) + 60px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
svg .str{stroke:#8c8474} svg .fr{stroke:var(--line)} svg .nut{stroke:var(--ink)}
svg .fd{fill:var(--orange)} svg .ft{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
svg .op{fill:none;stroke:var(--orange);stroke-width:1.5} svg .xx{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* v3 */
.top .tools-r{margin-left:auto;display:flex;align-items:center;gap:4px}
.top .tools-r .plan{margin-left:4px}
.badge{position:relative}
.badge b{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.filters{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.filters button.on{border-color:var(--ink);color:var(--ink)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.tag.pend{background:var(--orange-soft);color:var(--orange)}
.tag.ok{background:#e2efe3;color:#2f6b3a}
.tag.no{background:#f3e1df;color:#9b3a2e}
.credit{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted)}
.credit b{color:var(--ink)}
.learn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font-weight:600;text-decoration:none;font-size:14px}
.learn svg{width:16px;height:16px;fill:currentColor}
.heart{color:var(--muted)}
.heart.on{color:var(--orange)}
.heart.on svg{fill:var(--orange)}
.now{background:var(--orange);color:#fff!important;border-radius:4px;box-shadow:0 0 0 2px var(--orange)}
.roda-bar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:19;background:var(--blue);color:#fff}
.roda-bar .wrap{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600;font-size:14px}
.roda-bar button{margin-left:auto;border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:4px 12px;font-weight:600}
.dot-live{width:8px;height:8px;border-radius:50%;background:#7fe08a;box-shadow:0 0 0 3px rgba(127,224,138,.3)}
.qr{display:grid;place-items:center;background:#fff;border-radius:14px;padding:12px;margin:8px auto;width:max-content}
.qr img,.qr canvas{display:block;width:180px;height:180px}
.code{font-family:var(--f-mono);font-weight:700;font-size:28px;letter-spacing:.2em;text-align:center;color:var(--blue)}
.linkbox{display:flex;gap:6px;margin:8px 0}
.linkbox input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:13px}
.wa{background:#1f8f4e!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font:inherit}
.field textarea{font-family:var(--f-mono);font-size:13px;line-height:1.35;min-height:260px;white-space:pre;overflow:auto;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;background:var(--paper);color:var(--muted)}
.drop.over{border-color:var(--orange);background:var(--orange-soft)}
.drop b{color:var(--ink)}
.drop .types{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.drop .types span{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.status{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:14px}
.status.err{background:#f3e1df;color:#9b3a2e}
.prev{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:12px;margin-top:10px;overflow-x:auto}
.prev .sheet{--fs:13px}
.vtabs{display:flex;gap:6px;margin:6px 0}
.help{font-size:13px;color:var(--muted);margin:6px 0 12px}
.help code{font-family:var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink)}
.subcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.subcard h4{margin:0;font-size:16px}
.subcard .meta{color:var(--muted);font-size:13px;margin:2px 0 8px}
.subcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ok-btn{background:#2f6b3a!important}

/* modo palco */
body.stage{--bg:#111215;--paper:#1b1c21;--ink:#f4efe4;--muted:#9a958a;--line:#2c2d34;--blue:#8fb8ff;--blue-soft:#1d2a40;--tab:#9cb0cc}
body.stage .top,body.stage .tools,body.stage .shead .chips,body.stage .shead .by,body.stage .strip,body.stage .credit,body.stage .learn{display:none}
body.stage .repnav{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
body.stage .sheetwrap{padding-bottom:120px}
body.stage .shead h2{font-size:20px}
.stagebar{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.stagebar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
.stagebar .go{background:var(--orange);border-color:var(--orange);color:#fff}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--bg)}
.drop{display:block;cursor:pointer}

.arow{color:var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;text-align:left}

/* ferramentas */
.ttabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}

.gauge{position:relative;height:46px;max-width:360px;margin:18px auto 0}
.gauge .bar{position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;background:linear-gradient(90deg,var(--orange),#4c9a5b,var(--orange));opacity:.4}

.gauge .needle.on{background:var(--orange)}.gauge .needle.ok{background:#2f6b3a}

.btp{width:40px;height:40px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-weight:800;flex:none}

.btx{border:0;background:none;color:#fff;font-size:18px;padding:4px 6px;flex:none}
#btvol{width:70px;accent-color:var(--orange);flex:none}
body.hasbt .homepad{padding-bottom:calc(var(--tb) + 100px)}

.qt2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;min-height:92px;border:1px solid var(--line);background:var(--paper);border-radius:18px;color:var(--ink);font-weight:600;font-size:13px;line-height:1.2;text-align:center}

.achips .more{color:var(--orange);padding:5px 14px}

const MAJ=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];

const mod=(n,m)=>((n%m)+m)%m;
function pn(s){const m=/^([A-G])(#|b)?/.exec(s);if(!m)return null;const a=m[2]==="#"?1:m[2]==="b"?-1:0;return{L:m[1],a,pc:mod(NAT[m[1]]+a,12),len:m[0].length}}
function parseKey(k){const n=pn(k);return{...n,minor:/m$/.test(k.slice(n.len))}}
function keyName(pc,minor){return(minor?MIN:MAJ)[pc]+(minor?"m":"")}
function makeSpeller(orig,delta){ // devolve f(nota) -> nota escrita no tom de destino
  const o=parseKey(orig), tpc=mod(o.pc+delta,12), tname=(o.minor?MIN:MAJ)[tpc], t=pn(tname);
  const steps=mod(LET.indexOf(t.L)-LET.indexOf(o.L),7);
  const flat=/b/.test(tname)||(["F","Dm","Gm","Cm","Fm"].includes(tname+(o.minor?"m":"")));
  return s=>{const n=pn(s);if(!n)return s;if(!delta)return s.slice(0,n.len);
    const L=LET[(LET.indexOf(n.L)+steps)%7], pc=mod(n.pc+delta,12); let a=mod(pc-NAT[L]+6,12)-6;
    const r=L+(a===1?"#":a===-1?"b":"");
    if(Math.abs(a)>1||["Cb","Fb","E#","B#"].includes(r)) return (flat?FLAT:SHARP)[pc];
    return r;};

function trChord(tok,sp){ // transpõe raiz e baixo
  const lead=tok.startsWith("(")?"(":""; let s=lead?tok.slice(1):tok;

function trTab(tok,d){return tok.replace(/\d{2,3}/g,x=>{let f=+x.slice(1)+d;if(f<0)f+=12;return x[0]+f})}

const OPEN=[2,7,11,2]; // corda 4 (grave) -> corda 1
function chordSpec(name){
  const n=pn(name.replace(/^\(/,"")); if(!n) return null;
  let suf=name.replace(/^\(/,"").slice(n.len).replace(/\)$/,"");
  suf=suf.replace(/\*+$/,"").replace(/\)$/,"");
  let bass=null; const bm=/\/([A-G](#|b)?)$/.exec(suf); if(bm){bass=pn(bm[1]).pc;suf=suf.slice(0,bm.index)}
  suf=suf.replace(/7\+/,"7M").replace(/(\d+)([#+])(?!\d)/g,"#$1").replace(/(\d+)-(?!\d)/g,"b$1");
  const iv=new Map(); // intervalo -> prioridade (maior = mais essencial)
  let third=4, fifth=7, sus=false;
  if(/[°º]|dim/.test(suf)){iv.set(3,5);iv.set(6,5);iv.set(9,4);iv.set(0,2);return{root:n.pc,iv,bass}}
  if(/ø/.test(suf)){iv.set(3,5);iv.set(6,5);iv.set(10,5);iv.set(0,2);return{root:n.pc,iv,bass}}
  if(/^m(?!aj)/.test(suf)){third=3;suf=suf.slice(1)}
  let s=suf.replace(/7M|maj7|7\+/,()=>{iv.set(11,5);return""});
  if(/sus/.test(s)){sus=true;s=s.replace(/sus4?/,"")}
  s=s.replace(/^\+|aug/,()=>{fifth=8;return""});
  for(const m of s.matchAll(/([b#+-]?)(\d+)/g)){
    const acc=m[1]==="b"||m[1]==="-"?-1:(m[1]==="#"||m[1]==="+")?1:0, d=+m[2];
    if(d===7) iv.set(10,5);
    else if(d===6) iv.set(9,5);
    else if(d===5){ if(acc) fifth=7+acc; }
    else if(d===9||d===2) iv.set(2+acc,3);
    else if(d===11||d===4){ if(third===4&&!acc&&!/7M/.test(suf)&&!iv.has(9)) sus=true; else iv.set(5+acc,3); }
    else if(d===13) iv.set(9+acc,3);
  }
  if(sus) iv.set(5,5); else iv.set(third,5);
  iv.set(fifth, fifth===7?1:5);
  iv.set(0, iv.size>=4?2:4);
  return{root:n.pc,iv,bass};
}
const shapeCache=new Map();
function genShapes(name){
  if(shapeCache.has(name)) return shapeCache.get(name);
  const sp=chordSpec(name); let res=[];
  if(sp){
    const pcs=new Map(); for(const[i,p] of sp.iv) pcs.set(mod(sp.root+i,12),p);
    if(sp.bass!=null&&!pcs.has(sp.bass)) pcs.set(sp.bass,5);
    const ranked=[...pcs].sort((a,b)=>b[1]-a[1]);
    const req=ranked.filter(x=>x[1]>=3).slice(0,4).map(x=>x[0]);
    const cands=[];
    const opts=OPEN.map(o=>{const a=[];for(let f=0;f<=12;f++) if(pcs.has(mod(o+f,12))) a.push(f);return a});
    for(const a of opts[0])for(const b of opts[1])for(const c of opts[2])for(const d of opts[3]){
      const fr=[a,b,c,d], pressed=fr.filter(f=>f>0);
      if(!pressed.length) continue;
      const lo=Math.min(...pressed), hi=Math.max(...pressed); if(hi-lo>3) continue;
      const got=new Set(fr.map((f,i)=>mod(OPEN[i]+f,12)));
      if(!req.every(p=>got.has(p))) continue;
      if(sp.bass!=null&&mod(OPEN[0]+a,12)!==sp.bass) continue;
      let sc=lo*0.9+(hi-lo)*0.6+fr.filter(f=>f===0).length*1.2+(hi>10?3:0);
      if(sp.bass==null&&mod(OPEN[0]+a,12)===sp.root) sc-=1.2;
      sc-=got.size*0.3;
      cands.push({fr,sc,lo});
    }
    cands.sort((x,y)=>x.sc-y.sc);
    for(const c of cands){ if(res.every(r=>Math.abs(r.lo-c.lo)>=2)) res.push(c); if(res.length>=4) break; }
  }
  shapeCache.set(name,res); return res;
}
function svgShape(sh,w=72){
  const h=Math.round(w*1.2), x0=12, gap=(w-24)/3, y0=16, fh=(h-y0-8)/5;
  if(!sh) return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><text x="${w/2}" y="${h/2}" text-anchor="middle" class="xx">?</text></svg>`;
  const pressed=sh.fr.filter(f=>f>0), lo=Math.min(...pressed), base=Math.max(...sh.fr)<=5?1:lo;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  for(let i=0;i<=5;i++) s+=`<line class="${i===0&&base===1?"nut":"fr"}" stroke-width="${i===0&&base===1?3:1}" x1="${x0}" x2="${x0+3*gap}" y1="${y0+i*fh}" y2="${y0+i*fh}"/>`;
  for(let i=0;i<4;i++) s+=`<line class="str" x1="${x0+i*gap}" x2="${x0+i*gap}" y1="${y0}" y2="${y0+5*fh}"/>`;
  if(base>1) s+=`<text class="ft" x="${x0+3*gap+4}" y="${y0+fh*0.7}">${base}</text>`;
  sh.fr.forEach((f,i)=>{const x=x0+i*gap; if(f===0) s+=`<circle class="op" cx="${x}" cy="${y0-7}" r="3.2"/>`;
    else s+=`<circle class="fd" cx="${x}" cy="${y0+(f-base+0.5)*fh}" r="${Math.min(gap,fh)*0.36}"/>`;});
  return s+"</svg>";
}

function placeTokens(items,sp){ // resolve colunas (evita colisão quando o acorde cresce ao transpor)
  const out=[];let cur=0;
  for(const[col,raw] of items){
    let tok=raw, cls="";
    if(raw==="|") cls="b"; else if(raw===">") cls="p"; else if(raw==="%") cls="rp";
    else if(TABRE.test(raw)){tok=trTab(raw,tdelta());cls="t"}
    else if(CHORD.test(raw)){tok=trChord(raw,sp);cls="c"}
    const c=Math.max(col,cur);
    const html=cls==="c"?`<span class="c" data-ch="${esc(tok.replace(/^\((.*)\)$/,"$1"))}">${esc(tok)}</span>`:`<span class="${cls}">${esc(tok)}</span>`;
    out.push({c,len:tok.length,html});
    cur=c+tok.length+(cls==="c"||cls==="t"?1:0);
  }
  return out;
}
const isBar=k=>k.len===1&&/^[|%>]$/.test(k.html.replace(/<[^>]+>/g,""));
function wrapLine(text,toks,cols){ // quebra no último espaço que cabe; cada acorde desce junto com sua sílaba
  const out=[];let off=0;
  for(let n=0;n<200;n++){
    const restT=text.slice(off), restK=toks.filter(k=>k.c>=off);
    const end=Math.max(restT.length,...restK.map(k=>k.c-off+k.len),0);
    if(end<=0) break;
    const overflow=k=>k.c-off+k.len>cols&&!isBar(k), tl=restT.replace(/\s+$/,"").length;
    let cut, limit=cols;
    for(let g=0;g<40;g++){
      if(tl<=limit) cut=limit;
      else{const s1=restT.lastIndexOf(" ",limit-1);cut=s1>limit*0.4?s1+1:limit}
      const bad=restK.find(k=>k.c-off<cut&&overflow(k));
      if(!bad) break;
      if(bad.c-off<=0){cut=bad.len;break}
      limit=bad.c-off;
    }
    const after=restK.filter(k=>k.c-off>=cut);
    if(after.every(isBar)&&tl<=cut) cut=end;
    cut=Math.max(1,Math.min(cut,end));
    out.push([restK.filter(k=>k.c-off<cut),off,restT.slice(0,cut)]);
    if(cut>=end) break;
    off+=cut;
  }
  return out;
}
function rowHTML(toks,off){let s="",cur=0;for(const k of toks){const c=k.c-off;s+=" ".repeat(Math.max(0,c-cur))+k.html;cur=Math.max(c,cur)+k.len}return s}
function textHTML(text,tab){return tab?esc(text).replace(/\d{2,3}/g,x=>`<span class="t">${trTab(x,tdelta())}</span>`):esc(text)}
const tdelta=()=>{let d=mod(st.delta,12);return d>6?d-12:d};
/* ---------- descobrir o tom pelo áudio ----------
   1) Em cada janela (~0,37 s) mede a força das 12 notas (cromagrama), juntando as oitavas.
   2) Corrige a afinação da gravação (muita música não está em Lá = 440 Hz).
   3) Soma tudo e compara com o perfil de cada um dos 24 tons. Fica o mais parecido. */
const KD=(()=>{
  // perfis de tom (Temperley / Kostka-Payne): peso de cada grau da escala
  let PMAJ=[.748,.060,.488,.082,.670,.460,.096,.715,.104,.366,.057,.400];
  let PMIN=[.712,.084,.474,.618,.049,.460,.105,.747,.404,.067,.133,.330];
  function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<h;k++){const p=i+k,q=p+h,xr=re[q]*cr-im[q]*ci,xi=re[q]*ci+im[q]*cr;re[q]=re[p]-xr;im[q]=im[p]-xi;re[p]+=xr;im[p]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
  const wins=new Map();const OPT={baixo:2,harm:0};
  function tamanho(sr){let n=1;while(n<sr*.37)n<<=1;return n}
  /** picos espectrais de uma janela: [{midi (fracionário), w}] */
  function picos(x,sr,off=0){
    const n=tamanho(sr);let w=wins.get(n);if(!w){w=new Float32Array(n);for(let i=0;i<n;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/(n-1));wins.set(n,w)}
    const re=new Float64Array(n),im=new Float64Array(n);let e=0;
    for(let i=0;i<n;i++){const v=(x[off+i]||0);e+=v*v;re[i]=v*w[i]}
    if(Math.sqrt(e/n)<.004)return null; // silêncio
    fft(re,im);const h=n>>1,m=new Float64Array(h);for(let k=0;k<h;k++)m[k]=Math.hypot(re[k],im[k]);
    const k0=Math.floor(75*n/sr),k1=Math.min(h-2,Math.ceil(3200*n/sr));let mx=0;for(let k=k0;k<=k1;k++)if(m[k]>mx)mx=m[k];if(!mx)return null;
    const out=[];const R=Math.max(6,Math.round(25*n/sr));
    // média local para ignorar o "chiado" da percussão (picos precisam se destacar do entorno)
    const pre=new Float64Array(h+1);for(let k=0;k<h;k++)pre[k+1]=pre[k]+m[k];
    for(let k=k0;k<=k1;k++){const v=m[k];if(v<mx*.015||v<=m[k-1]||v<m[k+1])continue;
      const a=Math.max(0,k-R),b=Math.min(h,k+R+1),loc=(pre[b]-pre[a])/(b-a);if(v<loc*2.2)continue;
      const la=Math.log(m[k-1]+1e-12),lb=Math.log(v),lc=Math.log(m[k+1]+1e-12),d=la-2*lb+lc,p=d?.5*(la-lc)/d:0;
      const f=(k+p)*sr/n;out.push({midi:69+12*Math.log2(f/440),w:Math.sqrt(v/mx)})}
    // harmônicos 3, 5 e 6 de uma nota soam como quinta e terça "falsas": atenua quando a fundamental está presente
    if(OPT.harm){for(const p of out){for(const st of[19.02,27.86,31.02]){const f=p.midi-st;if(out.some(q=>Math.abs(q.midi-f)<.35&&q.w>=p.w*.5)){p.w*=OPT.harm;break}}}}
    return out;
  }
  /** acumulador: recebe janelas de áudio e devolve o ranking dos 24 tons */
  function novo(){
    const ch=new Float64Array(12);let cs=0,sn=0,quadros=0,ultimo=new Float64Array(12);
    return{
      add(x,sr,off=0){const ps=picos(x,sr,off);if(!ps||!ps.length)return false;
        // afinação: média circular do desvio de cada pico em relação ao semitom
        for(const p of ps){const a=2*Math.PI*p.midi;cs+=p.w*Math.cos(a);sn+=p.w*Math.sin(a)}
        const tun=Math.atan2(sn,cs)/(2*Math.PI);const c=new Float64Array(12);
        for(const p of ps){const mm=p.midi-tun,r=Math.round(mm),d=mm-r,g=Math.cos(Math.PI*d)**2;c[((r%12)+12)%12]+=p.w*g*(p.midi<55?OPT.baixo:1)}
        let s=0;for(const v of c)s=Math.max(s,v);if(!s)return false;
        for(let i=0;i<12;i++){c[i]/=s;ch[i]+=c[i]}ultimo=c;quadros++;return true},
      quadros:()=>quadros,
      afinacao:()=>Math.round(Math.atan2(sn,cs)/(2*Math.PI)*100), // cents em relação a Lá 440
      agora:()=>ultimo, croma:()=>{let s=0;for(const v of ch)s=Math.max(s,v);return Array.from(ch,v=>s?v/s:0)},
      ranking(){return rank(ch)}};
  }
  function corr(a,b){const n=12;let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let x=0,ya=0,yb=0;for(let i=0;i<n;i++){const p=a[i]-ma,q=b[i]-mb;x+=p*q;ya+=p*p;yb+=q*q}return ya&&yb?x/Math.sqrt(ya*yb):0}
  function rank(ch){const r=[];for(let t=0;t<12;t++)for(const minor of[false,true]){const P=minor?PMIN:PMAJ,rot=Array.from({length:12},(_,i)=>P[((i-t)%12+12)%12]);r.push({pc:t,minor,score:corr(ch,rot)})}
    return r.sort((a,b)=>b.score-a.score)}
  /** confiança do resultado: distância entre o 1º e o 2º colocado, sem contar o relativo */
  function confianca(r){if(!r.length||r[0].score<=0)return 0;const t=r[0],o=r.find(x=>!(x.pc===t.pc&&x.minor===t.minor));return Math.max(0,Math.min(1,(t.score-o.score)/.2))} // calibrado: ≥0,7 acertou 95% · 0,35–0,7 acertou 70% · abaixo, 42%
  /** relativo (Dó ↔ Lám) */
  function relativo(k){return k.minor?{pc:(k.pc+3)%12,minor:false}:{pc:(k.pc+9)%12,minor:true}}
  return{OPT,setPerfil(a,b){PMAJ=a;PMIN=b},novo,rank,confianca,relativo,tamanho};
})();


/* ================= parser de texto (acorde sobre a letra) ================= */
const ANNOT=/^(intro:?|final:?|solo:?|base:?|refr[aã]o:?|\(?volta|in[ií]cio\)?|refr[aã]o\)|solo\)|\(?\d+x\)?|-|\/|\(|\)|\*+|\\z)$/i;
function lineToks(line){
  const out=[];const re=/\S+/g;let m;
  while((m=re.exec(line))){const s=m[0],c=m.index;let buf="",bc=c;
    for(let i=0;i<s.length;i++){const ch=s[i];
      if("|>%".includes(ch)){if(buf){out.push({s:buf,c:bc});buf=""}out.push({s:ch,c:c+i})}
      else{if(!buf)bc=c+i;buf+=ch}}
    if(buf)out.push({s:buf,c:bc});}
  return out;
}
function kindOf(toks){
  if(!toks.length) return "blank";
  const real=toks.filter(t=>!ANNOT.test(t.s));
  if(real.length&&real.every(t=>TABRE.test(t.s))) return "tab";
  const chord=toks.filter(t=>"|>%".includes(t.s)||CHORD.test(t.s)).length;
  const other=toks.filter(t=>!("|>%".includes(t.s)||CHORD.test(t.s)||TABRE.test(t.s)||ANNOT.test(t.s))).length;
  if(chord&&other===0) return "chords";
  if(chord>=3&&other/toks.length<=.25) return "chords";
  return "text";
}
function parseChordText(src){
  const raw=String(src||"").replace(/\r/g,"").replace(/\t/g,"    ").split("\n");
  const out=[];let i=0,refrao=false;
  const gap=()=>{if(out.length&&out[out.length-1].t!=="gap")out.push({t:"gap"})};
  const boldOf=l=>/\s*\[b\]\s*$/i.test(l);
  const clean=l=>l.replace(/\s*\[b\]\s*$/i,"").replace(/\s+$/,"");
  while(i<raw.length){
    let l=raw[i];
    if(/^\s*\[(refr[aã]o)\]\s*$/i.test(l)){refrao=true;i++;continue}
    if(/^\s*\[\/(refr[aã]o)\]\s*$/i.test(l)){refrao=false;i++;continue}
    const b=boldOf(l)||refrao; l=clean(l);
    const tk=lineToks(l), k=kindOf(tk);
    if(k==="blank"){gap();refrao=false;i++;continue}
    if(k==="chords"){
      const nx=i+1<raw.length?clean(raw[i+1]):"", nk=kindOf(lineToks(nx));
      if(nk==="text"||nk==="tab"){
        out.push({t:"pair",text:nx,bold:boldOf(raw[i+1])||refrao,tab:nk==="tab",ch:tk.map(t=>[t.c,t.s])});i+=2;continue}
      out.push({t:"chords",ch:tk.map(t=>[t.c,t.s])});i++;continue}
    out.push({t:"text",text:l,bold:b,tab:k==="tab"});i++;
  }
  while(out.length&&out[out.length-1].t==="gap")out.pop();
  while(out.length&&out[0].t==="gap")out.shift();
  return out;
}
function guessKey(lines){
  const all=[];for(const l of lines) if(l.ch) for(const[,s] of l.ch) if(CHORD.test(s)&&!TABRE.test(s)) all.push(s.replace(/^\(/,""));
  const c=all[all.length-1]||all[0]; if(!c) return "C";
  const n=pn(c); return c.slice(0,n.len)+(/^m(?!aj)/.test(c.slice(n.len))?"m":"");
}

function chordRow(ch){let s="",prev="";for(const[c,t] of ch){const sp=/^[|>%]$/.test(t)||/^[|>%]$/.test(prev);if(s.length&&c<s.length+(sp?0:1))s+=sp?"":" ";else s=s.padEnd(c);s+=t;prev=t}return s}
function linesToText(lines){const o=[];for(const l of lines){if(l.t==="gap")o.push("");else if(l.t==="pair"){o.push(chordRow(l.ch));o.push(l.text.replace(/\s+$/,"")+(l.bold?" [b]":""))}else if(l.t==="chords")o.push(chordRow(l.ch));else o.push((l.text||"").replace(/\s+$/,"")+(l.bold?" [b]":""))}return o.join("\n")}

function dicShape(name){
  const n=String(name).replace(/^\((.*)\)$/,"$1").replace(/\*+$/,"");
  const m=/^([A-G])(#|b)?(.*)$/.exec(n);if(!m||/\/[A-G]/.test(m[3]))return null; // acorde com baixo: usa o gerador

  for(const t of tries){ // mesmo desenho deslocado (o dicionário ensina assim); só vale se nenhuma corda ficar abaixo da pestana
    const fr=t.sh.map(f=>f+t.d);if(fr.some(f=>f<0))continue;if(t.d!==0&&t.sh.some(f=>f===0)&&t.d<0)continue;
    if(Math.max(...fr)>14)continue;return {fr,dic:true,lo:Math.min(...fr.filter(f=>f>0))||0};
  }
  return null;
}

function mergeStore(srv){
  const loc=store, real=loc.reps.filter(r=>!r.example);
  const reps=[...(srv.reps||[])];const ids=new Set(reps.map(r=>r.id));
  for(const r of real){if(ids.has(r.id)){const sr=reps.find(x=>x.id===r.id);if(JSON.stringify(sr)!==JSON.stringify(r))reps.push({...r,id:"r"+rnd(4)})}else reps.push(r)}
  if(!reps.length)reps.push(...loc.reps);
  const uni=(a,b,n)=>[...new Set([...(a||[]),...(b||[])])].slice(0,n);
  return{...loc,reps,fav:uni(srv.fav,loc.fav,2000),hist:uni(loc.hist,srv.hist,30)};
}
async function syncPull(){if(!USER)return;
  const {data,error}=await sb.from("aluno_dados").select("dados").eq("user_id",USER.id).maybeSingle();
  if(error)return;
  if(data&&data.dados&&data.dados.reps){store=mergeStore(data.dados)}
  for(const r of store.reps) for(const it of r.items) if(typeof it.id==="number") it.id="s"+it.id;
  try{localStorage.setItem("rpc2",JSON.stringify(store))}catch(e){}
  syncPush(true);
}
let _syncT=null;
function syncPush(agora){if(!USER||!sb)return;clearTimeout(_syncT);_syncT=setTimeout(async()=>{
  const md=USER.user_metadata||{};
  await sb.from("aluno_dados").upsert({user_id:USER.id,nome:md.full_name||md.name||myName||null,dados:{reps:store.reps,fav:store.fav,hist:store.hist},atualizado:new Date().toISOString()})},agora?50:1500)}
function authErr(e){const m=String(e&&e.message||e||"");
  if(/invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/not confirmed/i.test(m))return"Falta confirmar o e-mail. Abra o link que enviamos para você.";
  if(/already registered|already exists/i.test(m))return"Esse e-mail já tem conta. Use a aba Entrar.";
  if(/at least 6|password.*short|weak/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/not authorized|rate limit|sending|smtp/i.test(m))return"Não conseguimos enviar o e-mail agora. Tente entrar com o Google ou fale com o professor.";
  if(/provider is not enabled|unsupported provider/i.test(m))return"Esse jeito de entrar ainda não foi ativado.";
  if(/valid email|invalid.*email/i.test(m))return"Confira o e-mail digitado.";
  return"Não deu certo agora. Tente de novo em instantes."}

    ${ext.google||ext.apple?`<div class="lgou"><span>ou com e-mail</span></div>`:""}

    <form class="lgform" novalidate>
      ${modo==="criar"?`<input name="nome" placeholder="Seu nome" autocomplete="name" maxlength="60">`:""}
      <input name="email" type="email" placeholder="E-mail" autocomplete="email" required>
      <input name="senha" type="password" placeholder="${modo==="criar"?"Crie uma senha (mínimo 6 caracteres)":"Senha"}" autocomplete="${modo==="criar"?"new-password":"current-password"}" required>
      <button class="primary" type="submit">${modo==="criar"?"Criar minha conta":"Entrar"}</button>
      ${modo==="entrar"?`<button type="button" class="linkbtn" data-esq="1">Esqueci minha senha</button>`:""}

    </form></div>`}
function loginWire(id){const W=document.querySelector(`[data-lg="${id}"]`);if(!W)return;const S=W.querySelector(".status"),F=W.querySelector("form");
  const msg=(t,err)=>{S.hidden=false;S.className="status"+(err?" err":"");S.textContent=t};
  const redo=m=>{const box=W.parentElement;W.outerHTML=loginForm(id,m);loginWire(id)};
  W.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>redo(b.dataset.m));
  W.querySelectorAll("[data-prov]").forEach(b=>b.onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:b.dataset.prov,options:{redirectTo:location.origin+location.pathname}});if(error)msg(authErr(error),true)});
  const esq=W.querySelector("[data-esq]");if(esq)esq.onclick=async()=>{const em=F.email.value.trim();if(!em)return msg("Digite seu e-mail acima e toque de novo em Esqueci minha senha.",true);
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});msg(error?authErr(error):"Enviamos um link para "+em+" para você criar uma senha nova.",!!error)};
  F.onsubmit=async e=>{e.preventDefault();const em=F.email.value.trim(),pw=F.senha.value,modo=W.dataset.modo,B=F.querySelector(".primary");
    if(!/^\S+@\S+\.\S+$/.test(em))return msg("Confira o e-mail digitado.",true);if(pw.length<6)return msg("A senha precisa ter pelo menos 6 caracteres.",true);
    B.disabled=true;msg(modo==="criar"?"Criando sua conta…":"Entrando…");
    if(modo==="criar"){const nome=(F.nome&&F.nome.value.trim())||"";
      const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nome},emailRedirectTo:location.origin+location.pathname}});B.disabled=false;
      if(error)return msg(authErr(error),true);
      if(data&&data.session){USER=data.session.user;await aoEntrar(true)}else msg("Conta criada! Enviamos um link de confirmação para "+em+". Abra o e-mail e depois entre aqui.")}
    else{const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});B.disabled=false;
      if(error)return msg(authErr(error),true);USER=data.user;await aoEntrar(true)}};
}

/* ---------- artistas ---------- */
function artistKey(a){return norm(a||"").replace(/^(grupo|banda)\s+/,"").replace(/[^a-z0-9]/g,"")}
function artistsAll(){
  const m=new Map();
  for(const s of [...SONGS,...PRIVATE.filter(p=>p.status!=="recusada")]){if(!s.artist)continue;const k=artistKey(s.artist);
    if(!m.has(k))m.set(k,{key:k,names:{},songs:[]});const a=m.get(k);a.songs.push(s);a.names[s.artist]=(a.names[s.artist]||0)+1}
  return [...m.values()].map(a=>({key:a.key,name:Object.entries(a.names).sort((x,y)=>y[1]-x[1])[0][0],songs:a.songs}));
}
let AFOTO={};
async function loadFotos(){if(!sb)return;const {data,error}=await sb.from("artista_foto").select("akey,url,credito,pagina,fonte").limit(2000);if(error||!data)return;
  AFOTO={};for(const x of data)if(x.url)AFOTO[x.akey]=x;if(["home","artist","song"].includes(st.view))draw()}
function fotoDe(name){const f=AFOTO[artistKey(name)];if(f)return f;const p=String(name||"").replace(/\(.*?\)/g,"").split(/\s+(?:e|part\.?|feat\.?|com|&)\s+|\s*[\/,]\s*/i)[0];return p&&p!==name?AFOTO[artistKey(p)]:null}
function artistAv(name,cls="",i=0){const f=fotoDe(name),ini=esc(initials(name||"?"));
  return `<span class="av ${cls} ${i%2?"b":""}">${f?`<img src="${esc(f.url)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${ini}'">`:ini}</span>`}
async function fotoSet(a,acao,img){const S=$("fstat");if(S){S.hidden=false;S.textContent=acao==="enviar"?"Enviando a foto…":"Removendo…"}
  try{const r=await fetch(SB_URL+"/functions/v1/artista-foto",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,...(await authHdr())},body:JSON.stringify({key:ADMIN_KEY,acao,akey:a.key,nome:a.name,img})});const d=await r.json();

function fotoArquivo(file,cb){const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),z=320;c.width=c.height=z;const g=c.getContext("2d"),m=Math.min(im.width,im.height);
  g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(im.src);cb(c.toDataURL("image/jpeg",.85))};im.onerror=()=>toast("Não consegui abrir essa imagem.");im.src=URL.createObjectURL(file)}
const initials=n=>n.split(/\s+/).filter(w=>w.length>2||/^[A-Z0-9]/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()||n[0].toUpperCase();
function artistRow(a,i){return `<button class="arow" data-artist="${esc(a.key)}">${artistAv(a.name,"",i)}<span class="t"><b>${esc(a.name)}</b><small>${esc(a.songs.slice(0,2).map(x=>x.title).join(", "))}${a.songs.length>2?"…":""}</small></span><span class="go">›</span></button>`}
function searchSongs(q){
  const words=norm(q).split(/\s+/).filter(Boolean);if(!words.length)return[];
  const list=[...PRIVATE,...SONGS].filter(s=>{const h=norm(s.title+" "+s.artist);return words.every(w=>h.includes(w))});
  const nq=norm(q).trim(),score=s=>{const t=norm(s.title),a=norm(s.artist);return t.startsWith(nq)?0:t.includes(nq)?1:a.startsWith(nq)?2:a.includes(nq)?3:4};
  return list.sort((a,b)=>score(a)-score(b)||a.title.localeCompare(b.title,"pt"));
}
function searchResults(q){
  const nq=norm(q).trim();
  const arts=artistsAll().filter(a=>a.key.includes(nq)||nq.split(/\s+/).every(w=>a.key.includes(w))).sort((a,b)=>b.songs.length-a.songs.length);
  const songs=searchSongs(q);
  let h="";
  if(arts.length) h+=`<div class="sec">Artistas</div>`+arts.slice(0,6).map(artistRow).join("");
  if(songs.length) h+=`<div class="sec">Músicas</div><div class="rows" style="padding-bottom:0">${songs.slice(0,60).map(s=>songRow(s)).join("")}</div>`;
  if(!h) h=`<div class="empty">Nada encontrado para “${esc(q)}”. Tente só uma parte do nome, ou <button class="linkbtn" id="sendIt">envie essa cifra</button>.</div>`;
  return h;
}

/* últimas adicionadas: mais novas primeiro; até duas por artista (sem cair na ordem alfabética) */
function ultimasAdicionadas(n){const h=x=>{let v=0;for(const c of String(x))v=(v*31+c.charCodeAt(0))|0;return v};
  const L=SONGS.filter(s=>s.addedAt&&!s.pending).sort((a,b)=>Math.floor(b.addedAt/36e5)-Math.floor(a.addedAt/36e5)||h(a.id)-h(b.id)),out=[],arts=new Map();
  for(const s of L){if(out.length>=n)break;const k=artistKey(s.artist),c=arts.get(k)||0;if(c>=2)continue;arts.set(k,c+1);out.push(s)}return out}

function addTo(rep,id){
  if(semRep()) return openDrawer("upsell",{why:"reps"});
  if(rep.items.some(i=>i.id===id)){toast("Essa música já está em “"+rep.name+"”");return}
  if(!isPro()&&rep.items.length>=FREE_SONGS) return openDrawer("upsell",{why:"songs"});
  rep.items.push({id,delta:st.view==="song"?st.delta:0});rep.example=false;save();
  toast(`Adicionada a “${rep.name}”${!isPro()?` · ${rep.items.length}/${FREE_SONGS}`:""}`);
  if(st.view==="home") drawTab(); else if(st.view==="song") drawSongTop();
}
function quickAdd(id){
  const target=repById(st.addTarget);
  if(target) return addTo(target,id);

  openDrawer("addrep",{id});

async function openShared(id){
  if(!sb) return;
  const {data,error}=await sb.from("shared").select("*").eq("id",id).maybeSingle();
  if(error||!data) return toast("Esse repertório não existe mais.");
  st.readyRep={name:data.name,items:(data.items||[]).filter(x=>byId(x.id))};go("rep",{rep:"sharedview"});
}
/* link fixo do painel: sambacifra.com.br/#painel */
function abrirPainel(){if(isAdmin){st.wantPanel=false;return go("review",{})}if(!USER){openDrawer("conta");setTimeout(()=>toast("Entre com a sua conta de professor para abrir o painel."),300);return}if(AUTH_OK)toast("Esta conta não é de professor.")}
function handleHash(){
  const h=(location.hash||"").slice(1);
  if(h==="professor"){history.replaceState(null,"",location.pathname);return openDrawer("professor")}
  if(h==="painel"){history.replaceState(null,"",location.pathname);st.wantPanel=true;return abrirPainel()}
  if(/^rep-/.test(h)) openShared(h.slice(4));
  else if(/^roda-/.test(h)) joinRoda(h.slice(5));
  else if(/^musica-/.test(h)){const id=decodeURIComponent(h.slice(7));history.replaceState(null,"",location.pathname);if(byId(id))go("song",{id});else toast("Essa música não está mais no app.")}
}
addEventListener("hashchange",handleHash);

async function saveMeta(id,m,msg){
  const {error}=await sb.rpc("admin_set_meta",{p_key:ADMIN_KEY,p_song:id,p_bpm:m.bpm?Math.round(m.bpm):null,p_aula:m.aula});
  if(error) return toast("Não foi possível salvar");meta[id]={bpm:m.bpm,aula:m.aula};toast(msg);if(st.view==="song")drawSongHead();
}

let dr=null;
const PRO_DR={metronomo:"met",batucada:"bt",tocar:"rol",afinador:"af"};
function openDrawer(kind,arg={}){$("toast").hidden=true;
  if(!isPro()&&PRO_DR[kind]){arg={why:PRO_DR[kind]};kind="upsell"}
  if(semRep()&&(kind==="addrep"||kind==="novo")){arg={why:"reps"};kind="upsell"}
  dr={kind,...arg};$("scrim").hidden=false;$("drawer").hidden=false;drawDrawer()}
function closeDrawer(){$("scrim").hidden=true;$("drawer").hidden=true;dr=null}
$("scrim").onclick=closeDrawer;
$("scrim").addEventListener("touchend",e=>{e.preventDefault();closeDrawer()},{passive:false});
$("dclose").onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape"&&dr)closeDrawer()});
(()=>{const D=$("drawer");let y0=null,dy=0;
  D.addEventListener("touchstart",e=>{y0=D.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
  D.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&D.scrollTop<=0){D.style.transform=`translateY(${dy}px)`;D.style.transition="none"}else if(dy<0){y0=null;D.style.transform=""}},{passive:true});
  D.addEventListener("touchend",()=>{if(y0==null)return;D.style.transition="transform .18s ease-out";if(dy>90){D.style.transform="translateY(100%)";setTimeout(()=>{closeDrawer();D.style.transform="";D.style.transition=""},170)}else D.style.transform="";y0=null},{passive:true});
})();

Responda só com JSON neste formato:
{"title":"...","artist":"...","key":"tom, ex. G ou Gm","versions":[{"label":"completa","text":"linhas separadas por \\n"},{"label":"simplificada","text":"..."}]}

async function toJpegB64(blob){
  const url=URL.createObjectURL(blob);try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const sc=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.9).split(",")[1];
  }finally{URL.revokeObjectURL(url)}
}

const titleCase=s=>s&&s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):s;

function splitHeader(text){ // primeiras linhas que não são cifra viram título/artista
  const ls=text.replace(/\r/g,"").split("\n");let title="",artist="";
  while(ls.length&&!ls[0].trim()) ls.shift();
  if(ls[0]&&kindOf(lineToks(ls[0]))==="text"&&ls[0].trim().length<60&&!(ls[1]&&kindOf(lineToks(ls[1]))==="chords"&&false)){
    const t=ls.shift().trim();const p=t.split(/\s+[-–]\s+/);title=titleCase(p[0]);artist=titleCase(p[1]||"");
    if(!artist&&ls[0]&&kindOf(lineToks(ls[0]))==="text"&&ls[0].trim().length<40&&ls[1]!==undefined&&kindOf(lineToks(ls[1]))!=="text"){artist=titleCase(ls.shift().trim())}
  }
  return{title,artist,versions:[{label:"completa",text:ls.join("\n")}]};
}
async function fromPdf(f){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;
  const pages=[];let totalChars=0;
  for(let p=1;p<=Math.min(pdf.numPages,6);p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent();
    const chars=[];
    for(const it of tc.items){const s=it.str;if(!s)continue;const x=it.transform[4],y=it.transform[5],sz=Math.hypot(it.transform[2],it.transform[3])||10;const w=it.width/(s.length||1);
      for(let i=0;i<s.length;i++) chars.push({ch:s[i],x:x+i*w,w,y,sz});}
    totalChars+=chars.filter(c=>c.ch.trim()).length;
    pages.push(pdfCharsToText(chars));
  }
  if(totalChars<20){ // PDF escaneado: vira imagem e vai para a IA
    const imgs=[];
    for(let p=1;p<=Math.min(pdf.numPages,3);p++){const page=await pdf.getPage(p),vp=page.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,"image/png")))}
    return fromImages(imgs);
  }
  return splitHeader(pages.join("\n\n"));
}
function pdfCharsToText(chars){ // mesma lógica do conversor do repertório: acorde ancorado na sílaba pela posição x
  chars.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const c of chars){const L=lines[lines.length-1];if(L&&Math.abs(L.y-c.y)<=L.sz*0.35)L.cs.push(c);else lines.push({y:c.y,sz:c.sz,cs:[c]})}
  lines.forEach(l=>l.cs.sort((a,b)=>a.x-b.x));
  const x0=Math.min(...chars.map(c=>c.x));
  const textOf=l=>{let s="",xs=[],last=null;const sw=l.sz*0.278;
    for(const c of l.cs){if(!c.ch.trim()){continue}
      if(last===null){const n=Math.max(0,Math.round((c.x-x0)/(l.sz*0.55)));s+=" ".repeat(n);for(let k=0;k<n;k++)xs.push(x0+k*l.sz*0.55)}
      else{const g=c.x-last;if(g>l.sz*0.12){const n=Math.max(1,Math.round(g/sw));s+=" ".repeat(n);for(let k=0;k<n;k++)xs.push(last+k*sw)}}
      s+=c.ch;xs.push(c.x);last=c.x+c.w}
    return{s,xs}};
  const tokOf=l=>{const t=[];let cur=null;for(const c of l.cs){if(!c.ch.trim()){cur=null;continue}
      if("|>%".includes(c.ch)){t.push({s:c.ch,x:c.x});cur=null;continue}
      if(cur&&c.x-cur.x1<=l.sz*0.15){cur.s+=c.ch;cur.x1=c.x+c.w}else{cur={s:c.ch,x:c.x,x1:c.x+c.w};t.push(cur)}}return t};
  const out=[];let prevY=null;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];if(prevY!==null&&prevY-l.y>l.sz*2.1) out.push("");
    const tk=tokOf(l);const k=kindOf(tk.map(t=>({s:t.s,c:0})));
    const nx=lines[i+1];
    if(k==="chords"&&nx&&l.y-nx.y<l.sz*1.8){const nk=kindOf(tokOf(nx).map(t=>({s:t.s,c:0})));
      if(nk==="text"||nk==="tab"){const {s,xs}=textOf(nx);let row="";
        for(const t of tk){let col;const last=xs[xs.length-1];
          if(!xs.length||t.x<xs[0]) col=Math.max(0,Math.round((t.x-x0)/(nx.sz*0.55)));
          else if(t.x>last+nx.sz*0.5) col=xs.length-1+Math.round((t.x-last)/(nx.sz*0.55));
          else{col=0;xs.forEach((cx,j)=>{if(cx<=t.x+nx.sz*0.2)col=j})}
          if(row.length<col)row+=" ".repeat(col-row.length);else if(row&&!row.endsWith(" "))row+=" ";row+=t.s}
        out.push(row.replace(/\s+$/,""),s.replace(/\s+$/,""));prevY=nx.y;i++;continue}}
    out.push(textOf(l).s.replace(/\s+$/,""));prevY=l.y;
  }
  return out.join("\n");
}

async function afOn(){

    const loop=t=>{f.raf=requestAnimationFrame(loop);if(f.ultimo&&t-f.ultimo<40)return;f.ultimo=t;
      if(f.surdo&&t<f.surdo){if(st.view==="tools"&&T.aba==="afinador")afPaint();return}

    bVizinhos(this.ritmo,bpm);const ref=bReferencia(this.ritmo,bpm);if(ref===atual.conj.bpm)return;

    const pos=this.pb0+(Math.max(this.ctx.currentTime,this.t0)+.12-this.t0)*this.bpm/60,comp=Math.max(0,Math.ceil(pos/4)*4),t=this.tempoDe(comp);
    this.grupo=this.comecarGrupo(novo,t,comp);this.encerrarGrupo(atual,t);this.saindo.push(atual);
    setTimeout(()=>{this.saindo=this.saindo.filter(g=>g!==atual)},Math.max(0,(t-this.ctx.currentTime+.2)*1000))}
}
