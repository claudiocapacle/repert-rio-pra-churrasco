/* estado */
function bMixPadrao(){const m={};for(const i of BRITMO.instrumentos)m[i.id]={on:true,vol:1};
  try{const s=JSON.parse(localStorage.getItem(BCHAVE)||"null");if(s)for(const id in m)if(s[id])m[id]={on:!!s[id].on,vol:Math.min(BVOLMAX,Math.max(0,+s[id].vol||0))}}catch(e){}return m}
Object.assign(T.bt,{bpm:90,on:false,loading:false,erro:"",mix:bMixPadrao(),solo:null,geral:.9,contagem:true,metro:false,volMetro:.8,tempo:-1,subir:{ativo:false,de:70,ate:100,cada:4},auto:null,sug:null,shown:false,motor:null,raf:0});
const bSalvarMix=()=>{try{localStorage.setItem(BCHAVE,JSON.stringify(T.bt.mix))}catch(e){}};
function bMotor(){const b=T.bt;if(!b.motor)b.motor=new MotorBatucada(BRITMO);return b.motor}
function bAplicarMix(){const b=T.bt,m=b.motor;if(!m)return;for(const ins of BRITMO.instrumentos){const c=b.mix[ins.id],ouvir=b.solo?b.solo===ins.id:c.on;m.volume(ins.id,ouvir?c.vol:0)}m.volumeGeral(b.geral);m.volumeMetronomo(b.volMetro)}
function bLoop(){const b=T.bt;cancelAnimationFrame(b.raf);
  const passo=()=>{const m=b.motor;if(!m||!m.tocando){b.tempo=-1;bTempoUi();return}
    const pos=m.posicao(),t=pos<0?-1:Math.floor(pos)%2;if(t!==b.tempo){b.tempo=t;bTempoUi()}
    const a=b.auto;if(a&&pos>=0){const comp=Math.floor((pos-a.inicio)/2),alvo=Math.min(a.ate,a.de+Math.floor(comp/a.cada));
      if(alvo!==b.bpm){b.bpm=alvo;m.mudarBpm(alvo);btUiLite()}if(alvo>=a.ate){b.auto=null;b.subir.ativo=false;btRedraw()}}
    b.raf=requestAnimationFrame(passo)};b.raf=requestAnimationFrame(passo)}
function bTempoUi(){document.querySelectorAll(".bbeats").forEach(el=>el.querySelectorAll("i").forEach((x,k)=>x.className=T.bt.tempo===k?(k===0?"on1":"on2"):""))}
async function bComecar(v){const b=T.bt,m=bMotor();m.metronomo(b.metro);bAplicarMix();await m.iniciar(v,b.contagem?4:0);b.on=true;bLoop()}
async function btPlay(){if(!isPro()){openDrawer("upsell",{why:"bt"});return}const b=T.bt;if(b.on)return;b.erro="";b.loading=true;b.shown=true;btUi();
  try{await bComecar(b.bpm)}catch(e){b.erro="Não foi possível carregar a batucada. Verifique a internet e tente de novo."}
  b.loading=false;btUi()}
function btPause(){const b=T.bt;if(b.motor)b.motor.parar();b.on=false;b.auto=null;b.subir.ativo=false;b.tempo=-1;btUi()}
function btStop(){btPause();T.bt.shown=false;btUi()}
function btSetBpm(v,manter){const b=T.bt;b.bpm=Math.min(BMAX,Math.max(BMIN,Math.round(v)));if(!manter){b.auto=null;if(b.subir.ativo){b.subir.ativo=false;btRedraw()}}if(b.motor)b.motor.mudarBpm(b.bpm);btUiLite()}
async function bSubir(){const b=T.bt,s=b.subir;const de=Math.min(BMAX,Math.max(BMIN,+s.de||BMIN)),ate=Math.min(BMAX,Math.max(de+1,+s.ate||de+1));b.bpm=de;
  const m=bMotor();if(!m.tocando){b.loading=true;b.shown=true;btUi();try{await bComecar(de)}catch(e){b.erro="Não foi possível carregar a batucada. Verifique a internet e tente de novo.";b.loading=false;return btUi()}b.loading=false}
  else await m.mudarBpm(de);
  b.auto={inicio:Math.max(0,Math.ceil(m.posicao()/2)*2),de,ate,cada:+s.cada||4};Object.assign(s,{de,ate,ativo:true});btUi()}

/* layout (gaveta da música e aba Ferramentas) */
function btPanel(p){const b=T.bt;
  const ins=BRITMO.instrumentos.map(i=>{const c=b.mix[i.id],ouvindo=b.solo?b.solo===i.id:c.on,pct=Math.min(1,c.vol/BVOLMAX);
    return`<div class="bcol${ouvindo?"":" off"}"><button class="bins" data-${p}ins="${i.id}" aria-pressed="${c.on}" aria-label="${i.nome}: ${c.on?"ligado":"desligado"}">${BDES[i.id]}<span>${i.nome}</span></button>
      <div class="bfad" data-${p}fad="${i.id}" role="slider" tabindex="0" aria-label="Volume do ${i.nome}" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="${BVOLMAX}" aria-valuenow="${c.vol}" style="--p:${pct}"><i></i><b></b><em><s></s></em></div>
      <button class="bsolo${b.solo===i.id?" on":""}" data-${p}solo="${i.id}" aria-pressed="${b.solo===i.id}" title="Ouvir só este">S</button></div>`}).join("");
  return `<p class="bnome">${BRITMO.nome}</p>
   <div class="big"><button class="round" data-${p}d="-1" aria-label="Diminuir 1 BPM">−</button><div style="text-align:center"><span class="num" data-bpmnum>${b.bpm}</span><div class="sub" style="margin:0" data-bpmand>BPM · ${andamento(b.bpm)}</div></div><button class="round" data-${p}d="1" aria-label="Aumentar 1 BPM">+</button></div>
   <input type="range" data-${p}range min="${BMIN}" max="${BMAX}" step="1" value="${b.bpm}" aria-label="Andamento em BPM">
   <div class="brange"><span>${BMIN}</span><span class="pills">${[-5,...(b.sug?[b.sug]:[]),5].map(v=>`<button data-${p}d="${v===b.sug?"=":""}${v}">${v===b.sug?v+" ★":(v>0?"+":"")+v}</button>`).join("")}</span><span>${BMAX}</span></div>
   ${b.sug?`<p class="help" style="text-align:center;margin:2px 0 0">★ andamento sugerido para esta música</p>`:""}
   <div class="bctl"><button class="bsm${b.contagem?" on":""}" data-${p}cont aria-pressed="${b.contagem}" title="Contagem de 4 tempos antes de começar">1234</button>
    <button class="bplay${b.on?" on":""}" data-${p}go aria-label="${b.on?"Parar":"Tocar"} batucada">${b.loading?'<span class="bspin"></span>':b.on?'<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'}</button>
    <button class="bsm${b.metro?" on":""}" data-${p}metro aria-pressed="${b.metro}" title="Metrônomo junto com a batucada">${ICO_METRO}</button></div>
   <div class="bbeats" aria-hidden="true"><i class="${b.tempo===0?"on1":""}">1</i><i class="${b.tempo===1?"on2":""}">2</i></div>
   <p class="help" style="text-align:center;margin:4px 0 0">${b.metro?"Metrônomo em 2 (acento no 1; o grave do surdo cai no 2)":b.contagem?"Começa com contagem de 4 tempos":"Começa direto, sem contagem"}</p>
   ${b.metro?`<label class="bvol" style="max-width:300px;margin:8px auto 0"><span>Metrônomo</span><input type="range" data-${p}vm min="0" max="1.5" step="0.05" value="${b.volMetro}" aria-label="Volume do metrônomo"></label>`:""}
   <div class="bmesa"><div class="bgrid">${ins}</div>
    <p class="help" style="text-align:center;margin:10px 0 0">Toque no desenho para ligar ou desligar. “S” deixa só aquele instrumento.</p>
    <label class="bvol bgeral"><span>Volume geral</span><input type="range" data-${p}vg min="0" max="1.2" step="0.05" value="${b.geral}" aria-label="Volume geral"></label></div>
   <div class="bsubir"><p class="bst">${ICO_SUBIR} Subir o andamento sozinho</p><p class="help" style="margin:2px 0 0">O BPM sobe de 1 em 1 enquanto você toca, sem parar a batucada.</p>
    <div class="bsg"><label><span>De</span><input type="number" inputmode="numeric" data-${p}sde min="${BMIN}" max="${BMAX}" value="${b.subir.de}"></label>
     <label><span>Até</span><input type="number" inputmode="numeric" data-${p}sate min="${BMIN}" max="${BMAX}" value="${b.subir.ate}"></label>
     <label><span>+1 a cada (compassos)</span><select data-${p}scada>${[1,2,4,8].map(c=>`<option value="${c}"${b.subir.cada===c?" selected":""}>${c}</option>`).join("")}</select></label></div>
    <button class="${b.subir.ativo?"ghost":"primary dark"}" data-${p}sgo style="width:100%;margin-top:10px">${b.subir.ativo?`Subindo… (parar em ${b.bpm} BPM)`:"Começar a subir"}</button></div>
   ${b.erro?`<p class="status err" style="text-align:center">${esc(b.erro)}</p>`:""}`}
function btWire(root,p,redraw){const b=T.bt,q=s=>root.querySelector(`[data-${p}${s}]`),qa=s=>root.querySelectorAll(`[data-${p}${s}]`);
  qa("d").forEach(el=>el.onclick=()=>{const v=el.getAttribute(`data-${p}d`);btSetBpm(v[0]==="="?+v.slice(1):b.bpm+ +v)});
  const r=q("range");if(r)r.oninput=e=>btSetBpm(+e.target.value);
  q("go").onclick=()=>{b.on?btPause():btPlay()};
  q("cont").onclick=()=>{b.contagem=!b.contagem;redraw()};
  q("metro").onclick=()=>{b.metro=!b.metro;if(b.motor)b.motor.metronomo(b.metro);redraw()};
  const vm=q("vm");if(vm)vm.oninput=e=>{b.volMetro=+e.target.value;bAplicarMix()};
  q("vg").oninput=e=>{b.geral=+e.target.value;bAplicarMix();const v=$("btvol");if(v)v.value=b.geral};
  qa("ins").forEach(el=>el.onclick=()=>{const c=b.mix[el.getAttribute(`data-${p}ins`)];c.on=!c.on;bSalvarMix();bAplicarMix();redraw()});
  qa("solo").forEach(el=>el.onclick=()=>{const id=el.getAttribute(`data-${p}solo`);b.solo=b.solo===id?null:id;bAplicarMix();redraw()});
  qa("fad").forEach(el=>{const id=el.getAttribute(`data-${p}fad`);let arr=false;
    const set=v=>{const c=b.mix[id];c.vol=Math.round(Math.min(BVOLMAX,Math.max(0,v))*20)/20;el.style.setProperty("--p",Math.min(1,c.vol/BVOLMAX));el.setAttribute("aria-valuenow",c.vol);bSalvarMix();bAplicarMix()};
    const deY=y=>{const rc=el.getBoundingClientRect(),h=rc.height-24;set(Math.min(1,Math.max(0,(rc.bottom-12-y)/h))*BVOLMAX)};
    el.onpointerdown=e=>{arr=true;el.setPointerCapture&&el.setPointerCapture(e.pointerId);deY(e.clientY);e.preventDefault()};
    el.onpointermove=e=>{if(arr)deY(e.clientY)};el.onpointerup=el.onpointercancel=()=>{arr=false};
    el.onkeydown=e=>{const c=b.mix[id];if(e.key==="ArrowUp"||e.key==="ArrowRight")set(c.vol+.05);else if(e.key==="ArrowDown"||e.key==="ArrowLeft")set(c.vol-.05);else return;e.preventDefault()}});
  const sd=q("sde"),sa=q("sate"),sc=q("scada");sd.oninput=e=>b.subir.de=+e.target.value;sa.oninput=e=>b.subir.ate=+e.target.value;sc.onchange=e=>b.subir.cada=+e.target.value;
  q("sgo").onclick=()=>{if(b.subir.ativo){b.auto=null;b.subir.ativo=false;redraw()}else bSubir()};
}
function btRedraw(){if(st.view==="tools"&&T.aba==="batucadas")drawBt();if(dr&&dr.kind==="batucada")drawDrawer()}
function drawBt(){T.bt.sug=null;$("tbody").innerHTML=`<p class="help" style="text-align:center;margin-top:0">Toque junto com surdo, pandeiro, rebolo, repiques e cuíca em qualquer andamento. Ligue, desligue e ajuste cada instrumento. A batucada continua enquanto você abre uma cifra.</p>`+btPanel("t");btWire($("tbody"),"t",drawBt)}
function btUiLite(){const b=T.bt;const n=$("btname");if(n)n.textContent=`Batucada · ${b.bpm} BPM`;
  document.querySelectorAll("[data-bpmnum]").forEach(x=>x.textContent=b.bpm);document.querySelectorAll("[data-bpmand]").forEach(x=>x.textContent="BPM · "+andamento(b.bpm));
  document.querySelectorAll("[data-trange],[data-drange]").forEach(x=>{if(+x.value!==b.bpm)x.value=b.bpm});
  document.querySelectorAll("[data-tsgo],[data-dsgo]").forEach(x=>{if(b.subir.ativo)x.textContent=`Subindo… (parar em ${b.bpm} BPM)`});
  if(st.view==="song")drawSongHead()}
function btUi(){btRedraw();refreshLive();
  const b=T.bt,bar=$("btbar");if(b.on||b.loading)b.shown=true;
  if(!b.shown){bar.hidden=true;document.body.classList.remove("hasbt");return}
  bar.hidden=false;document.body.classList.add("hasbt");
  bar.innerHTML=`<div class="wrap"><button class="btp" id="btpp" aria-label="${b.on?"Pausar":"Tocar"} batucada">${b.loading?"…":b.on?"❚❚":"▶"}</button>
   <button class="bti" id="btopen" style="border:0;background:none;text-align:left;padding:0;font:inherit;color:inherit"><b id="btname">Batucada · ${b.bpm} BPM</b><small>ver instrumentos</small></button>
   <button class="btx" id="btm" aria-label="Diminuir 1 BPM">−</button><button class="btx" id="btpl" aria-label="Aumentar 1 BPM">+</button>
   <input type="range" id="btvol" min="0" max="1.2" step="0.05" value="${b.geral}" aria-label="Volume da batucada"><button class="btx" id="btclose" aria-label="Fechar batucada">✕</button></div>`;
  $("btpp").onclick=()=>b.on?btPause():btPlay();$("btopen").onclick=()=>{if(st.view==="song"){const s=byId(st.id);T.bt.sug=bpmSug(s)}openDrawer("batucada")};
  $("btm").onclick=()=>btSetBpm(b.bpm-1);$("btpl").onclick=()=>btSetBpm(b.bpm+1);
  $("btvol").oninput=e=>{b.geral=+e.target.value;bAplicarMix()};$("btclose").onclick=btStop}
// já deixa o andamento padrão baixando quando a pessoa abrir a batucada
function bPreCarregar(){bConjunto(BRITMO,bReferencia(BRITMO,T.bt.bpm)).catch(()=>{})}


initCaps();

/* ----- descobrir o tom pelo som (arquivo, microfone ou vídeo do YouTube) ----- */
T.tom={modo:"mic",estado:"pronto",prog:0,acc:null,rank:null,croma:new Array(12).fill(0),viz:new Array(12).fill(0),nome:"",yt:"",erro:"",mic:null,raf:0,t0:0,afin:0};
const QUINTAS=[0,7,2,9,4,11,6,1,8,3,10,5];
const PT={C:"Dó",D:"Ré",E:"Mi",F:"Fá",G:"Sol",A:"Lá",B:"Si"};
function tomPt(k){const n=keyName(k.pc,k.minor),l=n[0],a=n[1]==="#"?" sustenido":n[1]==="b"?" bemol":"";return PT[l]+a+(k.minor?" menor":" maior")}
function tomCif(k){return keyName(k.pc,k.minor)}
function escala(k){return(k.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11]).map(i=>(k.pc+i)%12)}
/* o tom maior e o relativo menor usam a mesma escala: o resultado sai em par (ex.: Ré maior / Si menor) */
function tomPares(r){const out=[];for(const x of r||[]){const M=x.minor?KD.relativo(x):x;if(out.some(p=>p.maj.pc===M.pc))continue;out.push({maj:M,min:KD.relativo(M),prefMenor:!!x.minor,score:x.score})}return out}
function parTxt(p,pt){const a=p.prefMenor?[p.min,p.maj]:[p.maj,p.min];return pt?a.map(tomPt).join(" ou "):a.map(tomCif).join(" / ")}
function parConf(r){const P=tomPares(r);if(P.length<2)return 0;const g=P[0].score-P[1].score;return g>=.12?2:g>=.05?1:0} // calibrado: ≥0,12 acertou ~92% · 0,05–0,12 ~80% · abaixo ~60%
function tomAlternativas(r){const eq=(a,b)=>a.pc===b.pc&&a.minor===b.minor,rel=KD.relativo(r[0]);return[rel,...r.slice(1).filter(x=>!eq(x,rel))].slice(0,2)}
function ytId(u){const m=/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/.exec(u||"");return m?m[1]:/^[\w-]{11}$/.test((u||"").trim())?u.trim():null}

function rodaSVG(){const t=T.tom,lead=t.rank?t.rank[0]:null,esc=lead?escala(lead):[],R=96,C=120;
  const nos=QUINTAS.map((pc,i)=>{const a=(i/12)*2*Math.PI-Math.PI/2,x=C+R*Math.cos(a),y=C+R*Math.sin(a),v=t.viz[pc],dentro=esc.includes(pc),ton=lead&&lead.pc===pc;
    const rm=lead?(lead.minor?(lead.pc+3)%12:lead.pc):0,nm=(!lead?MAJ:[7,2,9,4,11,6].includes(rm)?SHARP:FLAT)[pc];
    return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(13+v*9).toFixed(1)}" class="kn${dentro?" in":""}${ton?" ton":""}" style="opacity:${(.28+v*.72).toFixed(2)}"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" class="kt${ton?" ton":""}">${nm}</text>`}).join("");
  const busca=t.estado==="ouvindo"||t.estado==="analisando";
  const par0=lead?tomPares(t.rank)[0]:null;const centro=lead&&t.acc&&t.acc.quadros()>=6?`<text x="${C}" y="${C-6}" class="kc${tomCif(par0.maj).length+tomCif(par0.min).length>4?" sm":""}">${tomCif(par0.prefMenor?par0.min:par0.maj)}/${tomCif(par0.prefMenor?par0.maj:par0.min)}</text><text x="${C}" y="${C+18}" class="ks">${busca?"procurando…":"tom provável"}</text>`:`<text x="${C}" y="${C+6}" class="ks">${busca?"ouvindo as notas…":"círculo das quintas"}</text>`;
  return`<svg viewBox="0 0 240 240" class="roda${busca?" busca":""}" role="img" aria-label="Notas detectadas"><circle cx="${C}" cy="${C}" r="${R}" class="kring"/>${busca?`<path d="M${C} ${C-R-14} A ${R+14} ${R+14} 0 0 1 ${C+R+14} ${C}" class="ksweep"/>`:""}${nos}${centro}</svg>`}

function tomLiveHTML(){const t=T.tom,r=t.rank,fim=t.estado==="pronto"&&r,ok=r&&t.acc&&t.acc.quadros()>=(t.estado==="ouvindo"?14:6);
  const P=tomPares(r),cf=r?parConf(r):0,cl=[["baixa","Confiança baixa · confira as outras opções"],["media","Confiança média"],["alta","Confiança alta"]][cf];
  return`${t.estado==="analisando"?`<div class="tprog"><i style="width:${Math.round(t.prog*100)}%"></i></div><p class="help" style="text-align:center;margin-top:6px">Analisando ${esc(t.nome)}…</p>`:""}
   ${t.estado==="ouvindo"?`<div class="tprog"><i style="width:${Math.min(100,Math.round(t.prog*100))}%"></i></div><p class="help" style="text-align:center;margin-top:6px">${t.prog<1?(t.modo==="voz"?"Continue cantando. A busca termina sozinha quando a barra encher (uns 20 segundos de melodia).":"Ouvindo… A busca termina sozinha quando a barra encher (até 30 segundos), ou antes, se o tom já estiver firme."):"Quase lá…"}</p>`:""}
   ${ok?`<div class="tres"><p class="lbl2" style="text-align:center">${fim?"A música está em":"Por enquanto"}</p>
     <p class="tpar"><b>${tomCif(P[0].prefMenor?P[0].min:P[0].maj)}</b><i>ou</i><b>${tomCif(P[0].prefMenor?P[0].maj:P[0].min)}</b></p>
     <p class="tbig2">${parTxt(P[0],true)}</p>
     <p class="help" style="text-align:center;margin:6px 0 0">Mesma escala e mesmos acordes. Se a música “descansa” no acorde menor, é ${tomPt(P[0].min)}; se descansa no maior, é ${tomPt(P[0].maj)}.</p>
     ${fim?`<p class="tconf ${cl[0]}">${cl[1]}</p>`:""}
     ${P.length>2?`<p class="lbl2" style="text-align:center;margin-top:12px">Se não bater, teste também</p><div class="pills" style="justify-content:center">${P.slice(1,cf===2?2:3).map(q=>`<span class="talt">${parTxt(q)}</span>`).join("")}</div>`:""}
     ${fim&&Math.abs(t.afin)>=15?`<p class="help" style="text-align:center">A gravação está ${Math.abs(t.afin)} cents ${t.afin>0?"acima":"abaixo"} do Lá 440. Para tocar junto, ajuste a afinação do cavaquinho.</p>`:""}</div>`:""}
   ${t.erro?`<p class="status err">${esc(t.erro)}</p>`:""}`}
function tomBtn(){const t=T.tom,r=t.rank;return t.mic?"Parar agora e ver o resultado":t.modo==="voz"?(r?"Cantar de novo":"Começar a cantar"):r?"Buscar de novo":t.modo==="yt"?"Dei play, começar a ouvir":"Começar a ouvir"}
function tomLive(){if(!(st.view==="tools"&&T.aba==="tom"))return;const el=$("tlive");if(!el)return drawTom();el.innerHTML=tomLiveHTML();const rd=$("troda");if(rd&&T.tom.estado==="pronto")rd.innerHTML=rodaSVG();const m=$("tmic");if(m)m.textContent=tomBtn();
  const l=document.querySelector("label.tbtn");if(l){const t=T.tom;l.textContent=t.estado==="analisando"?"Analisando…":t.rank?"Analisar outra música":"Escolher música do celular";l.toggleAttribute("aria-disabled",t.estado==="analisando")}}
function drawTom(){const t=T.tom,r=t.rank,id=ytId(t.yt);
  $("tbody").innerHTML=`<div class="pills tmodo" style="justify-content:center">${[["mic","Ouvir pelo microfone"],["voz","Cantar"],["yt","Link do YouTube"]].map(([k,l])=>`<button data-tm="${k}" class="${t.modo===k?"on":""}">${l}</button>`).join("")}</div>
   <div id="troda">${rodaSVG()}</div><div id="tlive">${tomLiveHTML()}</div>
   ${t.modo==="arquivo"?`<label class="primary tbtn" for="tfile">Escolher música do celular</label><input type="file" id="tfile" accept="audio/*,video/*,.mp3,.m4a,.wav,.ogg,.opus,.aac,.flac,.mp4" hidden>
     <p class="help" style="text-align:center">MP3, áudio do WhatsApp, gravação do celular ou vídeo. O áudio é analisado no seu aparelho e não é enviado para lugar nenhum.</p>`:""}
   ${t.modo==="voz"?`<button class="primary tbtn" id="tmic"></button>
     <p class="help" style="text-align:center">Cante o refrão ou um trecho da música por uns 20 a 30 segundos, perto do celular, sem instrumento tocando junto. Pode ser só no “lá-lá-lá”. O app segue a sua melodia nota por nota.</p>`:""}
   ${t.modo==="mic"?`<button class="primary tbtn" id="tmic"></button>
     <p class="help" style="text-align:center">Coloque o celular perto da caixa de som, do rádio ou da TV. Quanto menos conversa em volta, melhor.</p>`:""}
   ${t.modo==="yt"?`<div class="tyt"><input id="tyt" type="url" inputmode="url" placeholder="Cole aqui o link do vídeo" value="${esc(t.yt)}"><button class="ghost" id="tytok">Abrir</button></div>
     ${id?`<div class="tvid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0" title="Vídeo do YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
     <button class="primary tbtn" id="tmic"></button>
     <p class="help" style="text-align:center">Dê play no vídeo, aumente o volume e toque no botão. O app ouve o som pelo microfone. Se no seu celular o som do vídeo baixar quando o microfone liga, toque o vídeo em outro aparelho (TV ou computador) e use “Ouvir pelo microfone”.</p>`:`<p class="help" style="text-align:center">O vídeo abre aqui mesmo, e o app ouve a música enquanto ele toca.</p>`}`:""}
   <p class="tfine">Estimativa automática pelo som (cantando, a precisão é um pouco menor que ouvindo a música com os instrumentos). O resultado vem em par (tom maior e relativo menor) porque os dois têm a mesma escala e os mesmos acordes. Em testes com o repertório do app, o par certo ficou em 1º lugar em cerca de 8 a cada 10 músicas e entre as 2 primeiras opções em mais de 9 a cada 10. Pode errar em músicas que mudam de tom.</p>`;
  document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{if(T.tom.mic)tomOff(false);t.modo=b.dataset.tm;t.erro="";drawTom()});
  const f=$("tfile");if(f)f.onchange=e=>{const x=e.target.files[0];if(x)tomArquivo(x)};
  const m=$("tmic");if(m){m.textContent=tomBtn();m.onclick=()=>t.mic?tomOff(true):t.modo==="voz"?(isPro()?tomVoz():openDrawer("upsell",{why:"tom"})):tomMic()}
  const y=$("tyt");if(y){const ab=()=>{const v=$("tyt").value.trim();if(v===t.yt&&ytId(v))return;t.yt=v;t.erro=ytId(v)?"":"Esse link não parece ser de um vídeo do YouTube.";if(t.mic)tomOff(false);drawTom()};$("tytok").onclick=ab;y.onkeydown=e=>{if(e.key==="Enter")ab()};y.onpaste=()=>setTimeout(ab,0)}
  tomLive();
}
function tomViz(){const t=T.tom,c=t.acc?t.acc.croma():t.croma,a=t.acc?t.acc.agora():null;for(let i=0;i<12;i++){const alvo=a?.6*c[i]+.4*(a[i]||0):c[i];t.viz[i]+=(alvo-t.viz[i])*.35}
  if(st.view==="tools"&&T.aba==="tom"){const el=$("troda");if(el)el.innerHTML=rodaSVG()}}
function tomVivo(){tomLive()}
async function tomArquivo(file){const t=T.tom;if(t.estado==="analisando")return;t.erro="";t.nome=file.name.replace(/\.[^.]+$/,"");t.estado="analisando";t.prog=0;t.rank=null;t.acc=KD.novo();tomVivo();
  try{const ac=audioCtx(),buf=await file.arrayBuffer();const dec=await new Promise((ok,no)=>{const p=ac.decodeAudioData(buf,ok,no);if(p&&p.then)p.then(ok,no)});
    // mistura para mono e reduz para 22 050 Hz (mais rápido e não muda as notas)
    const sr=22050,len=Math.ceil(dec.duration*sr),off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr),src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
    const y=(await off.startRendering()).getChannelData(0),N=KD.tamanho(sr),tot=Math.max(1,Math.floor((y.length-N)/N));let i=0;
    await new Promise(fim=>{const passo=()=>{const t0=performance.now();while(i<tot&&performance.now()-t0<14){t.acc.add(y,sr,i*N);i++}t.prog=i/tot;t.rank=t.acc.quadros()?t.acc.ranking():null;tomViz();
      const p=document.querySelector(".tprog i");if(p)p.style.width=Math.round(t.prog*100)+"%";if(i%40<3)tomLive();if(i<tot)requestAnimationFrame(passo);else fim()};requestAnimationFrame(passo)});
    if(t.acc.quadros()<6)throw new Error("curto");
    t.rank=t.acc.ranking();t.afin=t.acc.afinacao();t.estado="pronto";
  }catch(e){t.estado="pronto";t.rank=null;t.acc=null;t.erro=e&&e.message==="curto"?"Não deu para ouvir notas suficientes nesse arquivo. Tente um trecho maior da música.":"Não foi possível ler esse arquivo neste aparelho. Tente um MP3 ou M4A."}
  const f=$("tfile");if(f)f.value="";tomVivo()}
const OPTV={peso:r=>1};
function vozAcc(){const ch=new Float64Array(12);let q=0,cs=0,sn=0,prev=null,run=0,ult=new Float64Array(12);
  return{add(buf,sr){const r=detectarFrequencia(buf,sr,75,1100);if(!r||r.q<.85){prev=null;run=0;return false}
      const m=69+12*Math.log2(r.f/440);cs+=Math.cos(2*Math.PI*m);sn+=Math.sin(2*Math.PI*m);const tun=Math.atan2(sn,cs)/(2*Math.PI),mm=m-tun,ri=Math.round(mm);
      if(Math.abs(mm-ri)>.35){run=0;return false} // passagem entre notas
      if(prev===ri)run++;else{prev=ri;run=1}if(run<3)return false; // a nota precisa ficar ~0,1 s
      const pc=((ri%12)+12)%12;ch[pc]+=OPTV.peso(run);q++;ult=new Float64Array(12);ult[pc]=1;return true},
    vozeadas:()=>q,quadros:()=>Math.floor(q/10),afinacao:()=>0,agora:()=>ult,
    croma:()=>{let s=0;for(const v of ch)s=Math.max(s,v);return Array.from(ch,v=>s?v/s:0)},ranking:()=>KD.rank(ch)}}
/* encerra sozinho: quando a barra completa, ou antes, se o par de tons já está firme há 8 s com confiança alta */
function tomAutoFim(){const t=T.tom,now=performance.now(),dt=now-t.t0;if(!t.mic)return false;
  if(t.prog>=1||dt>90000){tomOff(true);return true}
  const P=t.rank&&t.acc&&t.acc.quadros()>=6?tomPares(t.rank):null;if(!P||!P.length){t.estavel=null;return false}
  if(!t.estavel||t.estavel.pc!==P[0].maj.pc)t.estavel={pc:P[0].maj.pc,desde:now};
  if(dt>=15000&&now-t.estavel.desde>=8000&&parConf(t.rank)===2){tomOff(true);return true}return false}
async function tomVoz(){const t=T.tom;t.erro="";
  try{const ac=audioCtx();if(ac.state==="suspended")await ac.resume();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
    const src=ac.createMediaStreamSource(stream),hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=70;const an=ac.createAnalyser();an.fftSize=2048;src.connect(hp).connect(an);
    const buf=new Float32Array(an.fftSize);t.mic={stream,src};t.acc=vozAcc();t.rank=null;t.estado="ouvindo";t.prog=0;t.t0=performance.now();let ult=0;
    const loop=now=>{t.raf=requestAnimationFrame(loop);if(now-ult<40)return;ult=now;an.getFloatTimeDomainData(buf);if(t.acc.add(buf,ac.sampleRate)&&t.acc.quadros()>=3)t.rank=t.acc.ranking();t.prog=t.acc.vozeadas()*.04/20;tomViz()};
    t.raf=requestAnimationFrame(loop);
    t.estavel=null;t.tick=setInterval(()=>{if(tomAutoFim())return;tomLive()},1000);
    tomLive();
  }catch(e){t.erro=e&&e.name==="NotAllowedError"?"O microfone foi bloqueado. Libere o acesso ao microfone nas configurações do navegador e tente de novo.":"Não foi possível usar o microfone neste aparelho.";tomOff(false)}}
async function tomMic(){if(!isPro()){openDrawer("upsell",{why:"tom"});return}const t=T.tom;t.erro="";
  try{const ac=audioCtx();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=KD.tamanho(ac.sampleRate)>32768?32768:KD.tamanho(ac.sampleRate);an.smoothingTimeConstant=0;src.connect(an);
    const buf=new Float32Array(an.fftSize),hop=an.fftSize/ac.sampleRate*1000;t.mic={stream,src};t.acc=KD.novo();t.rank=null;t.estado="ouvindo";t.prog=0;t.t0=performance.now();let ult=0;
    const loop=now=>{t.raf=requestAnimationFrame(loop);if(now-ult>=hop){ult=now;an.getFloatTimeDomainData(buf);if(t.acc.add(buf,ac.sampleRate,0))t.rank=t.acc.ranking()}
      t.prog=t.acc.quadros()*hop/30000;tomViz()};
    t.raf=requestAnimationFrame(loop);
    t.estavel=null;t.tick=setInterval(()=>{if(tomAutoFim())return;tomLive()},1000);
    tomLive();
  }catch(e){t.erro=e&&e.name==="NotAllowedError"?"O microfone foi bloqueado. Libere o acesso ao microfone nas configurações do navegador e tente de novo.":"Não foi possível usar o microfone neste aparelho.";tomOff(false)}}
function tomOff(mostrar){const t=T.tom;cancelAnimationFrame(t.raf);clearInterval(t.tick);t.mic?.stream.getTracks().forEach(x=>x.stop());t.mic=null;
  if(t.estado==="ouvindo"){t.estado="pronto";if(!t.acc||t.acc.quadros()<6){t.rank=null;if(mostrar)t.erro="Não deu para ouvir notas suficientes. Aproxime o celular do som e tente de novo."}else{t.rank=t.acc.ranking();t.afin=t.acc.afinacao()}}
  tomVivo()}

if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
